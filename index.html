<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Candy Function Machine - Instant Guess Version</title>
    <style>
        :root { --line: #333; --primary: #4A90E2; --success: #2ECC71; --accent: #F99417; }
        body { font-family: 'Segoe UI', sans-serif; background-color: #F8F9FA; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; overflow: hidden; user-select: none; }
        
        #lobby { position: absolute; width: 100%; height: 100%; background: white; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .step-btn { width: 320px; padding: 20px; margin: 12px; font-size: 1.2rem; border-radius: 15px; border: none; cursor: pointer; color: white; transition: 0.3s; font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .step-btn:hover { transform: scale(1.05); filter: brightness(1.1); }
        
        #game-container { display: none; text-align: center; width: 100%; position: relative; }
        #game-area { position: relative; width: 950px; height: 550px; background: white; border-radius: 40px; box-shadow: 0 15px 50px rgba(0,0,0,0.05); margin: 0 auto; border: 1px solid #f0f0f0; }

        #progress-wrapper { position: absolute; right: 45px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; align-items: center; gap: 12px; z-index: 50; }
        #home-btn { background: none; border: 2px solid #eee; border-radius: 10px; cursor: pointer; color: #ccc; font-weight: bold; padding: 6px 12px; font-size: 0.75rem; transition: 0.2s; }
        #home-btn:hover { background: #f0f0f0; color: var(--line); border-color: var(--line); }

        #gauge-bg { width: 18px; height: 320px; background: #f8f8f8; border-radius: 20px; border: 4px solid var(--line); overflow: hidden; position: relative; display: flex; flex-direction: column-reverse; }
        #gauge-fill { width: 100%; height: 0%; background: linear-gradient(0deg, var(--success), #A2D94B); transition: height 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        #progress-label { font-size: 0.8rem; font-weight: bold; color: #ccc; letter-spacing: 1px; }

        .entry-lines { position: absolute; top: -50px; left: 65px; display: flex; gap: 50px; z-index: 5; }
        .exit-lines { position: absolute; bottom: -45px; right: 90px; display: flex; gap: 50px; z-index: 5; }
        .pipe-stick { width: 6px; height: 50px; background: var(--line); }

        #machine-main { position: absolute; top: 55%; left: 55%; transform: translate(-50%, -50%); width: 480px; height: 280px; border: 6px solid var(--line); border-radius: 45px; background: white; z-index: 10; display: flex; justify-content: center; align-items: center; gap: 35px; }
        .path-mask { position: absolute; background: white; z-index: 11; }
        .in-mask { top: -8px; left: 60px; width: 75px; height: 16px; } 
        .out-mask { bottom: -8px; right: 85px; width: 75px; height: 16px; } 
        
        .eyes-box { position: absolute; top: -85px; right: 50px; display: flex; gap: 20px; z-index: 20; }
        .eye-outer { width: 80px; height: 80px; background: white; border: 5px solid var(--line); border-radius: 50%; position: relative; overflow: hidden; }
        .pupil-inner { width: 35px; height: 35px; background: var(--line); border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }

        .slot { width: 130px; height: 170px; border: 2px solid #f0f0f0; border-radius: 25px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; background: #fff; }
        .slot-val { font-size: 3.5rem; font-weight: bold; color: var(--line); pointer-events: none; }
        .slot-tag { font-size: 0.8rem; font-weight: bold; color: #ccc; margin-bottom: 5px; }

        .candy { position: absolute; width: 35px; height: 35px; border-radius: 50%; z-index: 12; }
        .candy-in { background: #FF6B6B; border: 3px solid #C0392B; transition: 0.4s ease-in; } 
        .candy-out { background: #FFD93D; border: 3px solid var(--accent); transition: none; }
        
        #counter-display { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); font-size: 1.4rem; font-weight: bold; color: var(--accent); background: white; padding: 10px 25px; border: 3px solid var(--accent); border-radius: 15px; z-index: 20; }
        @keyframes machineShake { 0% { transform: translate(-50%, -50%); } 50% { transform: translate(-50.5%, -49.5%); } }
        .shaking { animation: machineShake 0.1s infinite; }
    </style>
</head>
<body oncontextmenu="return false;">

<div id="lobby">
    <h1>Candy Function Machine</h1>
    <button class="step-btn" style="background:var(--success)" onclick="startApp(1)">Step 1: Plus & Minus</button>
    <button class="step-btn" style="background:var(--primary)" onclick="startApp(2)">Step 2: Multi & Div</button>
</div>

<div id="game-container">
    <div id="game-area">
        <div id="progress-wrapper">
            <button id="home-btn" onclick="goHome()">HOME</button>
            <div id="progress-label">STAGE</div>
            <div id="gauge-bg"><div id="gauge-fill"></div></div>
            <div style="font-size: 1.5rem;">🏆</div>
        </div>

        <div id="input-box" style="position:absolute; left:70px; top:50%; transform:translateY(-50%);">
            <div class="slot-tag">INPUT</div>
            <div class="slot" style="border: 4px solid var(--primary); color: var(--primary);" onclick="adjustIn()">
                <div id="display-in" class="slot-val">1</div>
            </div>
        </div>

        <div id="machine-main">
            <div class="path-mask in-mask"></div> <div class="path-mask out-mask"></div>
            <div class="entry-lines"><div class="pipe-stick"></div><div class="pipe-stick"></div></div>
            <div class="exit-lines"><div class="pipe-stick"></div><div class="pipe-stick"></div></div>
            <div class="eyes-box">
                <div class="eye-outer"><div class="pupil-inner"></div></div>
                <div class="eye-outer"><div class="pupil-inner"></div></div>
            </div>
            <div class="slot" onclick="adjustOp()">
                <div class="slot-tag">RULE</div>
                <div id="display-op" class="slot-val">?</div>
            </div>
            <div class="slot" onclick="adjustNum()">
                <div class="slot-tag">VALUE</div>
                <div id="display-num" class="slot-val">?</div>
            </div>
        </div>
        <div id="counter-display">🍬 <span id="display-out">0</span></div>
    </div>

    <div style="margin: 30px auto; display: flex; gap: 20px; width: 640px; justify-content: center;">
        <button class="step-btn" style="background: var(--primary); flex:1;" onclick="testProcess()">🧪 TEST</button>
        <button class="step-btn" style="background: var(--success); flex:1;" onclick="checkGuess()">🎯 GUESS</button>
    </div>
</div>

<script>
    let currentStep = 1, currentIn = 1, secretOp, secretNum, userOp = '?', userNum = 0, active = false, solveCount = 1;
    let audioCtx = null;

    function initAudio() { if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    function playSound(f, t, d, v) { 
        if(!audioCtx) return; 
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = t; o.frequency.setValueAtTime(f, audioCtx.currentTime);
        g.gain.setValueAtTime(v, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + d);
        o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + d);
    }
    async function playYay() {
        const notes = [659.25, 880.00, 1046.50];
        for(let n of notes) { playSound(n, 'sine', 0.4, 0.1); await new Promise(r => setTimeout(r, 60)); }
    }
    function goHome() {
        if(active) return;
        if(confirm("Exit to menu?")) { solveCount = 1; document.getElementById('game-container').style.display = 'none'; document.getElementById('lobby').style.display = 'flex'; }
    }

    document.addEventListener('mousemove', (e) => {
        if(active) return;
        const pupils = document.querySelectorAll('.pupil-inner');
        pupils.forEach(p => {
            const r = p.parentElement.getBoundingClientRect();
            const center = { x: r.left + r.width/2, y: r.top + r.height/2 };
            const angle = Math.atan2(e.clientY - center.y, e.clientX - center.x);
            const dist = Math.min(20, Math.hypot(e.clientX - center.x, e.clientY - center.y) / 12);
            p.style.transform = `translate(calc(-50% + ${Math.cos(angle)*dist}px), calc(-50% + ${Math.sin(angle)*dist}px))`;
        });
    });

    function startApp(step) { initAudio(); currentStep = step; document.getElementById('lobby').style.display = 'none'; document.getElementById('game-container').style.display = 'block'; updateGauge(); initGame(); }
    function updateGauge() { const fill = document.getElementById('gauge-fill'); fill.style.height = ((solveCount - 1) * 10) + '%'; if(solveCount > 10) fill.style.height = '100%'; }
    
    function initGame() {
        active = false; userOp = '?'; userNum = 0;
        if(currentStep === 1) { secretOp = Math.random() > 0.5 ? '+' : '-'; secretNum = Math.floor(Math.random()*4)+1; currentIn = secretOp==='-' ? 5 : 1; }
        else { secretOp = Math.random() > 0.5 ? '*' : '/'; secretNum = Math.floor(Math.random()*3)+2; currentIn = (secretOp === '/') ? secretNum * 2 : 2; }
        document.getElementById('display-in').innerText = currentIn;
        document.getElementById('display-op').innerText = '?';
        document.getElementById('display-num').innerText = '0';
        document.getElementById('display-out').innerText = '0';
    }

    function adjustIn() { 
        if(active) return; 
        let maxVal = (currentStep === 2) ? (secretOp === '/' ? 100 : 9) : 10;
        const val = prompt(`Enter input (1-${maxVal}):`, currentIn);
        if(val && !isNaN(val)) { currentIn = Math.max(1, Math.min(maxVal, parseInt(val))); document.getElementById('display-in').innerText = currentIn; playSound(300, 'sine', 0.1, 0.1); }
    }

    function adjustOp() { if(active) return; const ops = currentStep===1 ? ['+','-'] : ['*','/']; userOp = userOp === ops[0] ? ops[1] : ops[0]; document.getElementById('display-op').innerText = userOp==='*'?'×':(userOp==='/'?'÷':userOp); playSound(400, 'square', 0.1, 0.1); }
    function adjustNum() { if(active) return; userNum = (userNum + 1) % 10; document.getElementById('display-num').innerText = userNum; playSound(500, 'square', 0.1, 0.1); }

    // [중요] 즉시 정답 확인 함수
    async function checkGuess() {
        if(active) return;
        if(userOp === secretOp && userNum === secretNum) {
            await playYay();
            if(solveCount >= 10) { solveCount = 11; updateGauge(); setTimeout(() => { alert("🎉 MASTER! ALL 10 STAGES CLEARED!"); location.reload(); }, 300); }
            else { solveCount++; updateGauge(); alert("🎯 CORRECT!"); initGame(); }
        } else {
            playSound(100, 'square', 0.4, 0.2); alert("❌ Try again!");
        }
    }

    // [중요] TEST 버튼 전용 시뮬레이션 함수
    async function testProcess() {
        if(active) return;
        if(secretOp === '/' && currentIn % secretNum !== 0) return alert(`Must be divisible by ${secretNum}!`);
        if(secretOp === '-' && currentIn < secretNum) return alert("Not enough candy!");

        active = true;
        document.getElementById('display-out').innerText = '0';
        const result = Math.floor(eval(`${currentIn}${secretOp}${secretNum}`));
        const machine = document.getElementById('machine-main');

        const dropInterval = Math.max(20, 350 - (currentIn * 15)); 
        for(let i=0; i<currentIn; i++) {
            const c = document.createElement('div'); c.className = 'candy candy-in';
            const targetX = machine.offsetLeft - 140; const targetY = machine.offsetTop - 190;
            c.style.left = targetX + 'px'; c.style.top = (targetY - 120) + 'px'; c.style.opacity = '1';
            document.getElementById('game-area').appendChild(c);
            if(i % 5 === 0 || currentIn < 20) playSound(200 + (i*5), 'sine', 0.1, 0.05);
            setTimeout(() => { c.style.top = targetY + 'px'; c.style.opacity = '0'; }, 50);
            await new Promise(r => setTimeout(r, dropInterval));
        }

        machine.classList.add('shaking');
        playSound(120, 'sawtooth', 0.8, 0.05);
        await new Promise(r => setTimeout(r, 800));
        machine.classList.remove('shaking');

        const outInterval = Math.max(15, 250 - (result * 10));
        for(let i=0; i<result; i++) {
            const c = document.createElement('div'); c.className = 'candy candy-out';
            const startX = machine.offsetLeft + 140; const startY = machine.offsetTop + 130;
            c.style.left = startX + 'px'; c.style.top = startY + 'px';
            document.getElementById('game-area').appendChild(c);
            document.getElementById('display-out').innerText = i + 1;
            if(i % 5 === 0 || result < 20) playSound(700 + (i*5), 'triangle', 0.1, 0.05);
            let x = startX, y = startY, vy = -3, vx = (Math.random()-0.5)*10;
            const drop = setInterval(() => { x += vx; y += vy; vy += 0.6; c.style.left = x+'px'; c.style.top = y+'px'; if(y > 600) { clearInterval(drop); c.remove(); } }, 20);
            await new Promise(r => setTimeout(r, outInterval));
        }
        active = false;
    }
</script>
</body>
</html>
